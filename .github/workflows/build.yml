# Karat Board - the scheduled build that makes this app a website.
#
# GitHub sweeps the merchants, writes rates.json beside the page and publishes
# the pair to Pages. Visitors get static files off a CDN; the Python never runs
# on anyone's request, so there is no server and no bill.

name: Build and publish

on:
  schedule:
    # Asked hourly, on odd minutes, in two independent entries.
    #
    # A single "0 */2 * * *" looked sensible and behaved badly: GitHub queues
    # free cron behind paid work and simply drops slots it cannot serve. Over
    # one day it delivered four runs instead of twelve, twice leaving the board
    # ~10 hours stale. Two lessons are baked in here - :00 is the most contended
    # minute on the whole platform, so ask at :17 and :47 instead; and a second
    # entry means a dropped slot is covered within the hour rather than the day.
    #
    # This does not cost more: proxy credits are rationed per merchant by
    # proxyAfterHours, not per build, and Actions minutes are free on a public
    # repo. Extra runs only re-read the merchants that cost nothing.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only MMTC-PAMP's price-list PDF needs a third-party library.
      - run: pip install --quiet pypdf

      - name: Sweep the merchants and build the page
        env:
          KB_EVERY: "120"                # what the page tells visitors
          KB_STATE: ${{ runner.temp }}/board.json
          # A runner is blank every time, and Cloudflare refuses Tanishq and
          # Bhima from any datacenter IP. Seed from what is already known so
          # those two age visibly instead of vanishing: the sweep committed from
          # a residential connection, plus whatever is currently published.
          KB_SEED_FILE: seed/rates.json
          KB_SEED_URL: https://karatboard.yourcardjourney.store/rates.json
          # Tanishq and Bhima refuse datacenter IPs outright. When a key is
          # present the build retries just those two from a residential IP, so
          # nothing here depends on anyone's PC being switched on. A credit is
          # spent only on a merchant that actually refused us - two per run.
          KB_PROXY_URL: "https://api.scrapingant.com/v2/general?url={url}&x-api-key={key}"
          KB_PROXY_KEY: ${{ secrets.SCRAPING_KEY }}
        run: python tools/build_site.py _site

      # The custom domain has to travel with the artifact.
      - run: cp CNAME _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site               # only the page - tools/ stays unpublished

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
