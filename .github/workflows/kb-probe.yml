# Temporary: a GB residential browser gets through Tanishq where IN, US and SG
# are refused. Confirm the response really carries the rate. Manual only.
name: KB probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Tanishq via a GB residential browser
        env:
          KEY: ${{ secrets.SCRAPING_KEY }}
        run: |
          target='https://www.tanishq.co.in/gold-rate.html?lang=en_IN'
          enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$target")
          url="https://api.scrapingant.com/v2/general?url=${enc}&x-api-key=${KEY}&proxy_country=GB&proxy_type=residential&browser=true"

          code=$(curl -s -o /tmp/o -w '%{http_code}' --max-time 150 "$url")
          echo "http=$code  bytes=$(wc -c < /tmp/o)"
          echo "title: $( { grep -o -i -m1 '<title>[^<]*' /tmp/o || true; } )"
          echo "--- does the board's own pattern match? ---"
          python3 tools/probe_rate.py /tmp/o
