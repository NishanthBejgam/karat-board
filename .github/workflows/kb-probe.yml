# Temporary: can Thangamayil be read directly from a runner, so it costs nothing?
# No proxy involved - this spends no credits. Manual only; delete once answered.
name: KB probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try Thangamayil straight from the runner
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          HDRS=(
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8'
            -H 'Accept-Language: en-IN,en;q=0.9'
            -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Mode: navigate'
            -H 'Sec-Fetch-Site: none' -H 'Upgrade-Insecure-Requests: 1'
          )

          try () {
            local label="$1"; local url="$2"; shift 2
            code=$(curl -sL --compressed --max-time 30 -o /tmp/o -w '%{http_code}' -A "$UA" "$@" "$url" || echo ERR)
            size=$(wc -c < /tmp/o 2>/dev/null || echo 0)
            rate=$( { grep -o -E 'GOLD RATE 22k \(1gm\) - </span><span>₹[0-9,]+' /tmp/o || true; } | head -1 )
            [ -z "$rate" ] && rate=$( { grep -o -E 'GOLD RATE 22k[^<]{0,30}' /tmp/o || true; } | head -1 )
            title=$( { grep -o -i -m1 '<title>[^<]*' /tmp/o || true; } | cut -c8-45 )
            printf '  %-34s http=%-5s bytes=%-8s %-28s %s\n' "$label" "$code" "$size" "$title" "${rate:-(no rate)}"
          }

          echo "=== the URL the board uses ==="
          try "rateshistory, plain"      "https://www.thangamayil.com/scheme/index/rateshistory/"
          try "rateshistory, browserish" "https://www.thangamayil.com/scheme/index/rateshistory/" "${HDRS[@]}"

          echo "=== other doors on the same site ==="
          try "homepage"                 "https://www.thangamayil.com/" "${HDRS[@]}"
          try "apex, no www"             "https://thangamayil.com/" "${HDRS[@]}"
