# Temporary: is the block purely by IP, or can headers / another host get through?
# Manual trigger only. Delete once answered.
name: KB probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'

          try () {  # label, url, extra curl args...
            local label="$1"; local url="$2"; shift 2
            code=$(curl -sL --compressed --max-time 30 -o /tmp/out.html -w '%{http_code}' \
                   -A "$UA" "$@" "$url" 2>/dev/null || echo ERR)
            size=$(wc -c < /tmp/out.html 2>/dev/null || echo 0)
            rate=$(grep -o -E '₹ ?[0-9][0-9,]{3,}' /tmp/out.html 2>/dev/null | head -1)
            title=$(grep -o -i -m1 '<title>[^<]*' /tmp/out.html 2>/dev/null | cut -c8-60)
            printf '  %-34s http=%-5s bytes=%-8s rate=%-12s %s\n' "$label" "$code" "$size" "${rate:--}" "$title"
          }

          echo "=== 1. plain, as the build does it now ==="
          try "tanishq plain" "https://www.tanishq.co.in/gold-rate.html?lang=en_IN"
          try "bhima plain"   "https://www.bhimagold.com/"

          echo "=== 2. full browser header set ==="
          H1='-H'; HDRS=(
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8'
            -H 'Accept-Language: en-IN,en-GB;q=0.9,en;q=0.8'
            -H 'sec-ch-ua: "Chromium";v="126", "Google Chrome";v="126", "Not-A.Brand";v="99"'
            -H 'sec-ch-ua-mobile: ?0'
            -H 'sec-ch-ua-platform: "Windows"'
            -H 'Sec-Fetch-Dest: document'
            -H 'Sec-Fetch-Mode: navigate'
            -H 'Sec-Fetch-Site: none'
            -H 'Sec-Fetch-User: ?1'
            -H 'Upgrade-Insecure-Requests: 1'
            -H 'Cache-Control: max-age=0'
          )
          try "tanishq full headers" "https://www.tanishq.co.in/gold-rate.html?lang=en_IN" "${HDRS[@]}"
          try "bhima full headers"   "https://www.bhimagold.com/" "${HDRS[@]}"

          echo "=== 3. http2 + full headers ==="
          try "tanishq http2" "https://www.tanishq.co.in/gold-rate.html?lang=en_IN" --http2 "${HDRS[@]}"
          try "bhima http2"   "https://www.bhimagold.com/" --http2 "${HDRS[@]}"

          echo "=== 4. sibling hostnames (may sit outside the WAF) ==="
          try "stores.tanishq"      "https://stores.tanishq.co.in/"
          try "staticimg.tanishq"   "https://staticimg.tanishq.co.in/"
          try "tanishq apex"        "https://tanishq.co.in/gold-rate.html?lang=en_IN"
          try "engage.bhimagold"    "https://engage.bhimagold.com/"
          try "images.bhimagold"    "https://images.bhimagold.com/"
          try "bhimagold apex"      "https://bhimagold.com/"
          try "bhima gold-rate page" "https://www.bhimagold.com/gold-rate-today"

          echo "=== 5. sibling Titan brands (same daily rate?) ==="
          try "mia gold rate"  "https://www.miabytanishq.com/gold-rate.html"
          try "caratlane"      "https://www.caratlane.com/gold-rate-today.html"
