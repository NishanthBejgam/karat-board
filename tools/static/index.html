<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KaratBoard</title>
  <meta name="description" content="🪙 One screen. Multiple jewellers. ⚡ Quick scan across jewellers, without opening multiple sites. And the 2% / 3% cut shows the price you actually get after the applicable cut." />
  <link rel="canonical" href="https://karatboard.yourcardjourney.store/" />
  <meta name="theme-color" id="themeColor" content="#8a5f14" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="YourCardJourney" />
  <meta property="og:title" content="Gold Rate Today — 22K &amp; 24K" />
  <meta property="og:description" content="🪙 One screen. Multiple jewellers. ⚡ Quick scan across jewellers, without opening multiple sites. And the 2% / 3% cut shows the price you actually get after the applicable cut." />
  <meta property="og:url" content="https://karatboard.yourcardjourney.store/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Gold Rate Today — 22K &amp; 24K" />
  <meta name="twitter:description" content="🪙 One screen. Multiple jewellers. ⚡ Quick scan across jewellers, without opening multiple sites. And the 2% / 3% cut shows the price you actually get after the applicable cut." />

  <link rel="icon" id="favicon" href="favicon.svg" />
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Board-specific bits, built on the shared design tokens. */
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px 40px; }

    /* ---- Headline strip ---- */
    .heads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 22px 0 18px; }
    @media (max-width: 780px) { .heads { grid-template-columns: 1fr; } }
    .head {
      background: var(--m3-surface-1); border: 1px solid var(--m3-outline-var);
      border-radius: var(--r-md); padding: 15px 18px; box-shadow: var(--shadow-1);
      display: flex; flex-direction: column; gap: 3px; position: relative; overflow: hidden;
      transition: transform .14s, box-shadow .18s;
      animation: rise .35s cubic-bezier(.2,.8,.2,1) both;
    }
    .head:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
    .head::after {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--foil-grad);
    }
    .head .k { font-size: 11px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase;
               color: var(--m3-on-surface-var); }
    .head .v { font-size: 25px; font-weight: 800; font-family: var(--mono); letter-spacing: -1px; }
    .head .w { font-size: 12.5px; color: var(--m3-on-surface-var); }

    /* ---- Controls row ---- */
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           flex-wrap: wrap; margin-bottom: 14px; }
    .seg { display: inline-flex; background: var(--m3-surface-2); border-radius: 10px; padding: 3px; gap: 3px;
           border: 1px solid var(--m3-outline-var); }
    .seg button { border: none; background: transparent; color: var(--m3-on-surface-var);
      padding: 7px 15px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 700; }
    .seg button.on { background: var(--m3-primary); color: var(--m3-on-primary); box-shadow: var(--shadow-1); }

    /* ---- The metal switch ----
       It was a second segmented control sitting beside the quantity one, in the
       same size and the same grey - so the control that changes the entire page
       looked like a minor preference. It now carries the weight: a larger pill,
       the metal's own colour as a pip so the choice reads before the word does,
       and the brand gradient when live. The quantity switch stays quiet beside
       it, which is the correct order of importance. */
    .seg.metal {
      padding: 4px; gap: 4px; background: var(--m3-surface-1);
      border-color: color-mix(in srgb, var(--m3-primary) 30%, var(--m3-outline-var));
      box-shadow: var(--shadow-1);
    }
    .seg.metal button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px; font-size: 14px; font-weight: 800; letter-spacing: .1px;
      color: var(--m3-on-surface-var); border-radius: 8px;
    }
    .seg.metal button:not(.on):hover { background: var(--m3-surface-2); color: var(--m3-on-surface); }
    .seg.metal button.on {
      background: var(--brand-grad); color: #fff;
      box-shadow: 0 4px 12px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,.35);
    }
    /* the pip is the metal itself, so it keeps its colour in either palette */
    .seg.metal .pip {
      width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto;
      box-shadow: inset 0 -1px 2px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.06);
    }
    .seg.metal .pip.au { background: linear-gradient(140deg, #f6d06a, #c9971f 60%, #8a5f14); }
    .seg.metal .pip.ag { background: linear-gradient(140deg, #f2f7fb, #b9ccdd 55%, #7d94a8); }
    .seg.metal button.on .pip { box-shadow: inset 0 -1px 2px rgba(0,0,0,.3), 0 0 0 2px rgba(255,255,255,.55); }

    /* quantity is a detail next to it */
    .bar-left .seg:not(.metal) button { font-size: 12.5px; font-weight: 600; }
    .bar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* ---- Which jewellers ----
       Fourteen chips across the top would outweigh the board they filter, so
       the whole thing folds into one button that says what it is doing. Search,
       tick, or narrow to one - and the headline strip recomputes over whatever
       is left, because "cheapest" should mean cheapest of the ones you asked
       for. Unlike the cut chips this IS remembered: it is about whose rates you
       care about, not about a different number. */
    .picker { position: relative; }
    .pick-btn {
      display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px;
      font-weight: 700; padding: 7px 11px 7px 12px; border-radius: 10px;
      background: var(--m3-surface-2); border: 1px solid var(--m3-outline-var);
      color: var(--m3-on-surface); transition: background .14s, border-color .14s;
    }
    .pick-btn:hover { background: var(--m3-surface-3); border-color: var(--m3-outline); }
    .pick-btn .chev { transition: transform .18s; opacity: .7; }
    .picker.open .pick-btn { border-color: var(--m3-primary); background: var(--m3-surface-3); }
    .picker.open .pick-btn .chev { transform: rotate(180deg); }
    .pick-btn.some { border-color: color-mix(in srgb, var(--gold) 55%, transparent);
                     background: color-mix(in srgb, var(--gold) 14%, var(--m3-surface-2)); }

    .pop {
      position: absolute; z-index: 40; top: calc(100% + 7px); left: 0; width: 302px; max-width: 88vw;
      background: var(--m3-surface-1); border: 1px solid var(--m3-outline-var);
      border-radius: var(--r-md); box-shadow: var(--shadow-2); overflow: hidden;
      display: flex; flex-direction: column;
      animation: pop-in .16s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes pop-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
    .pop-search { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
                  border-bottom: 1px solid var(--m3-outline-var); color: var(--m3-on-surface-var); }
    .pop-search input { flex: 1; min-width: 0; font: inherit; font-size: 13.5px; border: none;
                        background: transparent; color: var(--m3-on-surface); outline: none; }
    .pop-list { max-height: 296px; overflow-y: auto; padding: 6px; }
    .pop-row {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 7px;
      border: none; background: transparent; border-radius: 9px; font: inherit; text-align: left;
      color: var(--m3-on-surface);
    }
    .pop-row:hover { background: var(--m3-surface-2); }
    .pop-row .mark { width: 27px; height: 27px; border-radius: 8px; }
    .pop-row .mark svg { width: 17px; height: 17px; }
    .pop-row .rn { flex: 1; min-width: 0; font-size: 13px; font-weight: 600;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pop-row .only { font-size: 10.5px; font-weight: 800; letter-spacing: .4px; padding: 2px 7px;
      border-radius: 6px; border: 1px solid var(--m3-outline-var); background: var(--m3-surface-1);
      color: var(--m3-on-surface-var); opacity: 0; transition: opacity .12s; }
    .pop-row:hover .only, .pop-row .only:focus-visible { opacity: 1; }
    .pop-row .only:hover { color: var(--m3-primary); border-color: var(--m3-primary); }
    .tick {
      width: 17px; height: 17px; border-radius: 5px; flex: 0 0 auto; display: grid; place-items: center;
      border: 1.5px solid var(--m3-outline); color: transparent; transition: background .12s, border-color .12s;
    }
    .pop-row.on .tick { background: var(--m3-primary); border-color: var(--m3-primary);
                        color: var(--m3-on-primary); }
    .pop-empty { padding: 16px 12px; text-align: center; font-size: 12.5px;
                 color: var(--m3-on-surface-var); }
    .pop-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px 8px 14px; border-top: 1px solid var(--m3-outline-var);
      background: var(--m3-surface-2); font-size: 11.5px; color: var(--m3-on-surface-var); }
    .pop-acts { display: flex; align-items: center; gap: 4px; }
    /* Ticking is a draft until Apply commits it, so the board does not lurch
       under you five times while you pick five jewellers. Nothing to commit,
       nothing to press. */
    .pop-foot .btn-sm { padding: 5px 10px; font-size: 12px; }
    #pickApply:disabled { opacity: .4; pointer-events: none; }
    .pop-row.draft-off .mark { opacity: .45; }
    .pop-row.draft-off .rn { color: var(--m3-on-surface-var); }

    /* nothing ticked - say so on the board rather than showing a blank page */
    .board-empty { grid-column: 1 / -1; text-align: center; padding: 44px 16px;
      border: 1px dashed var(--m3-outline-var); border-radius: var(--r-lg);
      color: var(--m3-on-surface-var); font-size: 13.5px; }
    .board-empty .btn { margin-top: 12px; }

    .meta { font-size: 12.5px; color: var(--m3-on-surface-var); display: flex; align-items: center; gap: 8px; }
    .meta .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--m3-ok); }
    .meta .dot.busy { background: var(--m3-warn); animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .3; } }

    /* ---- The board ---- */
    .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 16px; }
    .card {
      background: var(--m3-surface-1); border: 1px solid var(--m3-outline-var);
      border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 16px 17px 13px;
      display: flex; flex-direction: column; gap: 12px; position: relative;
      transition: transform .14s, box-shadow .18s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .head { animation: none; } }
    .card.best {
      border-color: color-mix(in srgb, var(--gold) 65%, transparent);
      box-shadow: var(--shadow-2), 0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent);
    }
    .card.dim { opacity: .82; }

    .who { display: flex; align-items: center; gap: 11px; }
    /* One tile treatment for all eight marks: a gold-tinted chip, a bronze
       hairline and the merchant's shape drawn in the board's own ink. */
    .mark {
      width: 38px; height: 38px; border-radius: 11px; flex: 0 0 auto; display: grid; place-items: center;
      font-weight: 800; font-size: 13px; letter-spacing: .5px; overflow: hidden;
      color: var(--m3-primary);
      background: color-mix(in srgb, var(--gold) 15%, var(--m3-surface-2));
      border: 1px solid color-mix(in srgb, var(--gold) 32%, transparent);
      transition: background .16s, border-color .16s;
    }
    .mark svg { width: 23px; height: 23px; }
    /* the mark settles into place on hover - the same motion the Karat Board
       tile in the header uses, staggered piece by piece */
    .mark svg > * { transform-box: fill-box; transform-origin: center; }
    .card:hover .mark svg > * { animation: an-mark .42s cubic-bezier(.22,1,.36,1) both; }
    .card:hover .mark svg > :nth-child(2) { animation-delay: .05s; }
    .card:hover .mark svg > :nth-child(3) { animation-delay: .1s; }
    .card:hover .mark svg > :nth-child(4) { animation-delay: .15s; }
    .card:hover .mark svg > :nth-child(5) { animation-delay: .2s; }
    @keyframes an-mark { from { transform: scale(.68); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card:hover .mark svg > * { animation: none; } }
    .card:hover .mark {
      background: color-mix(in srgb, var(--gold) 26%, var(--m3-surface-2));
      border-color: color-mix(in srgb, var(--gold) 52%, transparent);
    }
    .who .nm { flex: 1; min-width: 0; }
    .who .nm b { display: block; font-size: 14.5px; font-weight: 700; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
    .who .nm small { font-size: 11.5px; color: var(--m3-on-surface-var); }
    .state { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .state.ok { background: var(--m3-ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--m3-ok) 18%, transparent); }
    .state.stale { background: var(--m3-warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--m3-warn) 18%, transparent); }
    .state.off { background: var(--m3-outline); }
    .state.err { background: var(--m3-error); box-shadow: 0 0 0 3px color-mix(in srgb, var(--m3-error) 18%, transparent); }

    /* the two numbers that matter */
    .rates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rates.one { grid-template-columns: 1fr; }   /* silver quotes one purity */
    .rate {
      background: var(--m3-surface-2); border-radius: var(--r-sm); padding: 10px 12px 9px;
      border: 1px solid transparent;
    }
    .rate.k24 { background: color-mix(in srgb, var(--gold) 13%, var(--m3-surface-2));
                border-color: color-mix(in srgb, var(--gold) 26%, transparent); }
    .rate .kt { font-size: 10.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
                color: var(--m3-on-surface-var); display: flex; align-items: center; gap: 5px; }
    .rate .amt { font-family: var(--mono); font-size: 19px; font-weight: 800; letter-spacing: -.7px;
                 margin-top: 3px; }
    .rate .per { font-size: 11px; color: var(--m3-on-surface-var); }
    .rate .none { font-family: var(--mono); font-size: 19px; font-weight: 800; color: var(--m3-outline); }
    .drv { font-size: 9.5px; font-weight: 800; padding: 1px 5px; border-radius: 5px;
           background: var(--m3-surface-3); color: var(--m3-on-surface-var); letter-spacing: .4px; }

    /* ---- Buyback ----
       Not another block of text under every merchant - the cut is a filter, and
       the 24K tile itself flips over to answer it. Off by default, so the board
       stays a board. */
    .cut-row { display: flex; justify-content: flex-end; margin-top: -5px; }
    .cuts { display: inline-flex; gap: 3px; padding: 2px; border-radius: 8px;
            background: var(--m3-surface-2); border: 1px solid var(--m3-outline-var); }
    .cuts button { border: none; background: transparent; font: inherit; font-size: 10.5px;
      font-weight: 800; letter-spacing: .3px; padding: 3px 9px; border-radius: 6px;
      color: var(--m3-on-surface-var); transition: background .14s, color .14s; }
    .cuts button:hover { color: var(--m3-ok); }
    .cuts button.on { background: var(--m3-ok); color: var(--m3-surface-1); }

    .rate.k24.buyback {
      background: color-mix(in srgb, var(--m3-ok) 13%, var(--m3-surface-2));
      border-color: color-mix(in srgb, var(--m3-ok) 32%, transparent);
    }
    .rate.k24.buyback .amt { color: var(--m3-ok); }
    .rate.flip { animation: flip .4s cubic-bezier(.4, 0, .2, 1); }
    @keyframes flip {
      0%   { transform: perspective(420px) rotateY(0); }
      50%  { transform: perspective(420px) rotateY(-88deg); }
      100% { transform: perspective(420px) rotateY(0); }
    }
    @media (prefers-reduced-motion: reduce) { .rate.flip { animation: none; } }

    .err-note { font-size: 11.5px; line-height: 1.5; color: var(--m3-error); word-break: break-word; }

    .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px;
            border-top: 1px solid var(--m3-outline-var); padding-top: 9px; margin-top: auto; }
    .foot .when { font-size: 11px; color: var(--m3-on-surface-var); }
    .foot .acts { display: flex; gap: 2px; }
    .foot .acts button { width: 30px; height: 30px; border-radius: 8px; border: none;
      background: transparent; color: var(--m3-on-surface-var); display: grid; place-items: center; }
    .foot .acts button:hover { background: var(--m3-surface-3); color: var(--m3-primary); }

    .badge {
      position: absolute; top: -9px; right: 14px; font-size: 9.5px; font-weight: 900;
      letter-spacing: 1px; padding: 3px 9px; border-radius: 999px; color: #fff;
      background: var(--foil-grad); box-shadow: 0 3px 9px var(--brand-glow);
    }
    .badge.manual { background: var(--m3-surface-3); color: var(--m3-on-surface-var);
                    box-shadow: none; border: 1px solid var(--m3-outline-var); }

    .spark { display: block; width: 100%; height: 24px; color: var(--m3-primary); opacity: .75; }

    @media (max-width: 560px) {
      .topbar-inner { padding: 10px 14px; gap: 8px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 11px; }
      .brand-word { font-size: 19px; }
      .wrap { padding: 0 14px 32px; }
      .heads { gap: 10px; margin: 16px 0 14px; }
      .board { grid-template-columns: 1fr; }
      .fields { grid-template-columns: 1fr; }
    }

    /* dialog fields */
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fld { display: flex; flex-direction: column; gap: 5px; }
    .fld label { font-size: 11px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase;
                 color: var(--m3-on-surface-var); }
    .fld input {
      font: inherit; font-family: var(--mono); color: var(--m3-on-surface);
      background: var(--m3-surface-2); border: 1px solid var(--m3-outline-var);
      border-radius: 11px; padding: 11px 13px; outline: none; width: 100%;
    }
    .fld input:focus { border-color: var(--m3-primary); background: var(--m3-surface-3); }
    .site-credit .handle { text-decoration: none; }
    .site-credit .handle:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <!-- a stack of bullion bars -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path class="an-bar" d="M9.6 4.6h6.2l1.5 4.2H8.1z" fill="#fff" fill-opacity=".28"/>
            <path class="an-bar" d="M4.4 11.1h6.2l1.5 4.2H2.9z" fill="#fff" fill-opacity=".28"/>
            <path class="an-bar" d="M13.4 11.1h6.2l1.5 4.2h-9.2z" fill="#fff" fill-opacity=".28"/>
            <path class="an-bar" d="M8.9 17.6h6.2l1.5 4.2H7.4z" fill="#fff" fill-opacity=".28"/>
          </svg>
        </span>
        <div class="brand-text">
          <span class="brand-word">Karat<em>Board</em></span>
          <span class="brand-tag">Multi jewellers · One screen</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="meta" id="status" title="Loading…"><span class="dot"></span></span>
        <button class="btn btn-tonal btn-sm" id="refreshBtn" title="Re-read every merchant now">
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
          <span>Refresh</span>
        </button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/><path d="M12 2v2m0 16v2M4 12H2m20 0h-2M5.6 5.6 4.2 4.2m15.6 15.6-1.4-1.4M5.6 18.4 4.2 19.8M19.8 4.2l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="heads" id="heads"></section>

    <div class="bar">
      <div class="bar-left">
        <div class="seg metal" id="metalSeg" role="group" aria-label="Metal">
          <button data-metal="gold" class="on"><i class="pip au"></i>Gold</button>
          <button data-metal="silver"><i class="pip ag"></i>Silver</button>
        </div>
        <div class="picker" id="picker">
          <button class="pick-btn" id="pickBtn" aria-expanded="false" aria-haspopup="dialog"
                  title="Choose which jewellers the board shows">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path fill="currentColor" d="M3.6 5.2h16.8l-6.5 7.6v5.4l-3.8 2.2v-7.6z"/>
            </svg>
            <span id="pickLabel">All jewellers</span>
            <svg class="chev" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path fill="currentColor" d="M7 10l5 5 5-5z"/>
            </svg>
          </button>
          <div class="pop" id="pickPop" role="dialog" aria-label="Choose jewellers" hidden>
            <label class="pop-search">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path fill="currentColor" d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/>
              </svg>
              <input id="pickSearch" type="text" placeholder="Search jewellers…"
                     autocomplete="off" spellcheck="false" aria-label="Search jewellers" />
            </label>
            <div class="pop-list" id="pickList"></div>
            <div class="pop-foot">
              <span id="pickCount"></span>
              <span class="pop-acts">
                <button class="btn btn-text btn-sm" id="pickNone">None</button>
                <button class="btn btn-text btn-sm" id="pickAll">All</button>
                <button class="btn btn-filled btn-sm" id="pickApply" disabled>Apply</button>
              </span>
            </div>
          </div>
        </div>
        <div class="seg" role="group" aria-label="Quantity">
          <button data-unit="1" class="on">Per gram</button>
          <button data-unit="10">Per 10 g</button>
        </div>
      </div>
      <span class="meta" id="statusText">Loading…</span>
    </div>

    <section class="board" id="board"></section>

    <footer class="site-credit">
      <span class="credit-text">
        Shared by <a class="handle" href="https://yourcardjourney.store/">@YourCardJourney</a>
      </span>
    </footer>
  </main>

  <div class="scrim" id="manualScrim" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h2 id="mTitle">Key in a rate</h2>
      <p class="sub" id="mSub"></p>
      <div class="fields">
        <div class="fld"><label for="m22">22K buy</label><input id="m22" inputmode="decimal" placeholder="blank to derive" /></div>
        <div class="fld"><label for="m24">24K buy</label><input id="m24" inputmode="decimal" placeholder="blank to derive" /></div>
        <div class="fld"><label for="s22">22K sell</label><input id="s22" inputmode="decimal" placeholder="optional" /></div>
        <div class="fld"><label for="s24">24K sell</label><input id="s24" inputmode="decimal" placeholder="optional" /></div>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-text" id="mClear">Clear</button>
        <button class="btn btn-text" id="mCancel">Cancel</button>
        <button class="btn btn-filled" id="mSave">Save</button>
      </div>
    </div>
  </div>

  <div class="snackbar" id="snack"><span id="snackText"></span></div>

  <script src="app.js"></script>
</body>
</html>
